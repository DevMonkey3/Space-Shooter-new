name: Build

# Checks every push and pull request: formatting, static analysis and an
# Android APK build. The APK is kept as a downloadable artifact for 7 days.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib
      - run: flutter analyze

      # No signing key on CI, so this APK is signed with a debug key.
      # Official downloads come from the GitHub Releases page.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: space-shooter-2400-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
